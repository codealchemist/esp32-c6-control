; Board bring-up smoke test — NOT part of the main firmware.
; Initializes the confirmed ST7789 panel on the Waveshare ESP32-C6-LCD-1.47
; and cycles the screen through solid colors, to confirm wiring/orientation
; before any real UI code is written. See src/main.cpp for pin/offset
; details, sourced from Waveshare's own example firmware.

[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
