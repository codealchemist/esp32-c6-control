; ESP32-C6 Remote Control Panel — Proof of Concept
; See ../docs/POC.md for what this validates and why.

[env:esp32-c6]
; The official `espressif32` platform ships esp32-c6-devkitc-1.json with
; "frameworks": ["espidf"] only — Arduino on the C6/H2 lives in the
; community pioarduino fork, so `framework = arduino` fails there outright.
; Pinned to an exact release rather than a moving branch: this fork moves
; fast, and an unpinned URL turns a working build into a surprise upgrade.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Decodes backtrace addresses in panics into file:line automatically. Worth
; having by default on a board that has never been run before.
monitor_filters = esp32_exception_decoder

; LVGL + BLE (NimBLE GATT) + Wi-Fi + MQTT together are more
; than the default single-app partition table comfortably fits — use the
; larger app partition layout rather than tuning this by trial and error.
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; This board's USB-C goes straight to the C6's native USB Serial/JTAG
    ; (GPIO12/13 — the pins pins.h deliberately avoids); there is no USB-UART
    ; bridge on UART0. arduino-esp32 defaults ARDUINO_USB_CDC_ON_BOOT to 0,
    ; which maps Serial to UART0 — i.e. to pins nothing is connected to, so
    ; every Serial.println() in this POC would vanish and the monitor would sit
    ; blank after a perfectly successful flash. This routes Serial over USB.
    ; UNVERIFIED on hardware: if your monitor is blank *with* this set, the
    ; board may have a UART bridge after all — drop both lines and retry.
    ;
    ; Both flags are required, and USB_MODE=1 is not the default: the C6 has
    ; only USB Serial/JTAG, no native USB OTG. With CDC_ON_BOOT=1 alone the
    ; core takes its native-USB branch and fails to compile on `USBSerial`.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; LVGLImage.py's generated C arrays default to `#include "lvgl/lvgl.h"`,
    ; which assumes lvgl's *parent* dir is on the include path — it isn't under
    ; PlatformIO's layout. This define switches them to plain "lvgl.h".
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; lvgl is built as a library, and PlatformIO does NOT put include/ on the
    ; include path for library builds — only these flags reach them. Without
    ; -Iinclude, lvgl's `#include "lv_conf.h"` fails even though the file
    ; exists exactly where README step 3 says to put it.
    -Iinclude
    -Isrc
    -Isrc/generated

; Firmware sources only (not libraries): `Serial` becomes LogTee, which
; also keeps the log for the web console's Logs page (src/log_tee.h).
build_src_flags = -include src/log_tee.h

extra_scripts = pre:scripts/build_icons.py

lib_deps =
    lvgl/lvgl@^9.2.0
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.0

; MOOT since the move to Provisioning Protocol v2 (docs/PROVISIONING_PROTOCOL_V2.md):
; protocomm and network_provisioning are gone entirely, and with them the
; duplicate-protobuf-symbol clash that needed a link-line hook. What remains
; from ESP-IDF is esp_mqtt_client plus mbedTLS (HKDF/AES-GCM), both of which
; are usable out of the box under PlatformIO's Arduino framework with no
; sdkconfig/menuconfig changes — the question this note originally raised.
;
; BLE is now the Arduino BLE library over NimBLE, which coexists with
; Arduino's WiFi.h rather than competing with it for esp_netif/esp_wifi
; bring-up — the specific runtime conflict flagged here previously no longer
; applies. Concurrent BLE + Wi-Fi + MQTT is still unverified on hardware.
